[project]
name = "kalshi-lip-recorder"
version = "0.2.0"
description = "Record and score Kalshi Liquidity Incentive Program order books"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pandas>=2.0", "pyarrow>=14", "numpy>=1.24", "cryptography>=41"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
